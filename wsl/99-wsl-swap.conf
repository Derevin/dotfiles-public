# Pairs with zram-swap.service. With a fast compressed-RAM swap in front of the
# slow disk swap, prefer moving cold anonymous pages to zram over dropping the
# file cache the editor and shells refault from — so bias swap higher, not lower.
# Without zram this would push interactive pages onto the slow disk: don't apply
# one without the other.
#
# Install (needs root):
#   sudo cp 99-wsl-swap.conf /etc/sysctl.d/
#   sudo sysctl --system
vm.swappiness = 100
